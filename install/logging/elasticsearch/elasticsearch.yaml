# Central log store: 3 nodes, each master + data + ingest, so the cluster survives losing one node.
# The `elastic` superuser password is generated by ECK into the secret logs-es-elastic-user
# (never stored in git).
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: logs
  namespace: logging
spec:
  version: 9.5.5
  http:
    service:
      metadata:
        annotations:
          # Private load balancer only. The first annotation is read by the AWS Load Balancer
          # Controller, the second by the in-tree cloud provider; both keep it internal.
          service.beta.kubernetes.io/aws-load-balancer-scheme: internal
          service.beta.kubernetes.io/aws-load-balancer-internal: "true"
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
      spec:
        type: LoadBalancer
        # Networks allowed to reach port 9200. Add the VPC CIDR of every peered cluster and EC2 host.
        loadBalancerSourceRanges:
          - 172.31.0.0/16
    tls:
      selfSignedCertificate:
        # Private DNS name the clusters use to reach Elasticsearch (a Route 53 private record
        # pointing at the load balancer). Fluent Bit verifies the certificate against this name.
        subjectAltNames:
          - dns: <ES_PRIVATE_DNS>
  nodeSets:
    - name: default
      count: 3
      config:
        node.store.allow_mmap: false   # no vm.max_map_count change needed on the nodes
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                # Heap is sized automatically to half of the memory limit.
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  memory: 2Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data   # name required by ECK
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: es-gp3
            resources:
              requests:
                storage: 2Gi           # pilot size; grow it in place once GB/day is measured
