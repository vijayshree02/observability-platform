# Shared Fluent Bit pipeline for every Kubernetes cluster (chart fluent/fluent-bit 0.58.3).
# Each cluster adds its identity file on top:
#   helm install fluent-bit fluent/fluent-bit --version 0.58.3 -n logging \
#     -f install/logging/fluent-bit/values-base.yaml -f integrations/<project>/clusters/<cluster>.yaml
#
# Identity, set by the cluster file under `identity:` (required; kept in its own block so it never
# collides with the chart's own settings such as `env`):
#   identity.project: tribe            -> logs go to data stream logs-<project>, ES user fluentbit-<project>
#   identity.cluster: <unique name>    -> added to every log line
#   identity.env: dev | staging | prod -> added to every log line
#
# Credentials come from the Kubernetes secret fluent-bit-es (keys: password, ca.crt), filled from the
# secret manager. Never put them in these files.

identity: {}

elasticsearch:
  host: <ES_PRIVATE_DNS>
  port: 9200

image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  tag: 5.1.3

testFramework:
  enabled: false

# Run on every node, including tainted ones, so no pod's logs are missed.
tolerations:
  - operator: Exists
priorityClassName: system-node-critical

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

env:
  - name: ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: fluent-bit-es
        key: password

extraVolumes:
  - name: es-ca
    secret:
      secretName: fluent-bit-es
      items:
        - key: ca.crt
          path: ca.crt
extraVolumeMounts:
  - name: es-ca
    mountPath: /fluent-bit/tls
    readOnly: true

config:
  service: |
    [SERVICE]
        Daemon                    Off
        Flush                     {{ .Values.flush }}
        Log_Level                 {{ .Values.logLevel }}
        Parsers_File              /fluent-bit/etc/parsers.conf
        Parsers_File              /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 {{ .Values.metricsPort }}
        Health_Check              On
        # Disk buffer on the node: logs survive Elasticsearch outages and Fluent Bit restarts.
        storage.path              /var/log/flb-storage/
        storage.sync              normal
        storage.backlog.mem_limit 50M

  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        # Fluent Bit's own logs are left out to avoid a feedback loop.
        Exclude_Path      /var/log/containers/fluent-bit-*_logging_*.log
        multiline.parser  docker, cri
        # Remembers how far each file was read, so restarts neither lose nor repeat lines.
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        storage.type      filesystem

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        # JSON log lines become fields (level, message, request_id, ...).
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              On
        Annotations         Off
        Buffer_Size         0

    [FILTER]
        Name    modify
        Match   kube.*
        # The time comes from the container runtime; an app's own @timestamp is kept as app_timestamp.
        Rename  @timestamp app_timestamp
        Set     project {{ required "identity.project is required (cluster file)" .Values.identity.project }}
        Set     cluster {{ required "identity.cluster is required (cluster file)" .Values.identity.cluster }}
        Set     env     {{ required "identity.env is required (cluster file)" .Values.identity.env }}

  outputs: |
    [OUTPUT]
        Name                     es
        Match                    kube.*
        Host                     {{ .Values.elasticsearch.host }}
        Port                     {{ .Values.elasticsearch.port }}
        HTTP_User                fluentbit-{{ .Values.identity.project }}
        HTTP_Passwd              ${ES_PASSWORD}
        tls                      On
        tls.verify               On
        tls.ca_file              /fluent-bit/tls/ca.crt
        Index                    logs-{{ .Values.identity.project }}
        Write_Operation          create
        Suppress_Type_Name       On
        Replace_Dots             On
        Time_Key                 @timestamp
        Buffer_Size              512KB
        Trace_Error              On
        # Keep retrying while Elasticsearch is unreachable; up to 5G per node is held on disk meanwhile.
        Retry_Limit              False
        storage.total_limit_size 5G
