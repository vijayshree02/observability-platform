# key=value lines with an RFC 3339 timestamp, e.g.
#   timestamp=2026-10-30T10:26:42.534Z level=error message="..." caller=/src/cmd/x.go:161 sc=libredesk
[PARSER]
    Name         logfmt_app
    Format       logfmt
    Time_Key     timestamp
    Time_Format  %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep    Off

# Any JSON line; its own time fields are kept as ordinary fields.
[PARSER]
    Name    json_any
    Format  json
