# Shared Fluent Bit pipeline for plain Docker hosts (no Kubernetes), e.g. EC2 servers running
# docker compose. Everything host-specific comes from environment variables set in that host's
# compose file (integrations/<project>/hosts/<host>/docker-compose.override.yml):
#   LOG_PROJECT, LOG_CLUSTER, LOG_ENV, LOG_HOST   identity added to every log line
#   LOGFMT_CONTAINERS                              regex of container names that log key=value (logfmt)
#   ES_HOST, ES_PASSWORD                           Elasticsearch address and fluentbit-<project> password
#
# Containers must log with the json-file driver and the option tag={{.Name}}, which adds the
# container name to every line.

[SERVICE]
    Flush                     1
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf
    Parsers_File              /fluent-bit/etc/conf/parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    # Disk buffer: logs survive Elasticsearch outages and Fluent Bit restarts.
    storage.path              /buffer/
    storage.sync              normal
    storage.backlog.mem_limit 50M

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    # Remembers how far each file was read, so restarts neither lose nor repeat lines.
    DB                /buffer/flb_docker.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    storage.type      filesystem

# Remove colour codes and the trailing newline from every line.
[FILTER]
    Name    lua
    Match   docker.*
    script  /fluent-bit/etc/conf/clean.lua
    call    clean

# Docker's {"attrs":{"tag":"<container>"}} becomes the field `container`.
[FILTER]
    Name          nest
    Match         docker.*
    Operation     lift
    Nested_under  attrs
    Add_prefix    attrs_

[FILTER]
    Name    modify
    Match   docker.*
    Rename  attrs_tag container
    Remove  time

# Fluent Bit's own logs are left out to avoid a feedback loop.
[FILTER]
    Name     grep
    Match    docker.*
    Exclude  container fluent.?bit

# Lines from logfmt containers are re-tagged so only they get the logfmt parser.
[FILTER]
    Name                   rewrite_tag
    Match                  docker.*
    Rule                   $container ${LOGFMT_CONTAINERS} logfmt.$container false
    Emitter_Name           logfmt_emitter
    Emitter_Storage.type   filesystem
    Emitter_Mem_Buf_Limit  50M

# key=value lines become fields (level, message, caller, ...); the app's timestamp becomes the log time.
[FILTER]
    Name          parser
    Match         logfmt.*
    Key_Name      log
    Parser        logfmt_app
    Reserve_Data  On

# JSON lines from other containers become fields; plain-text lines are kept as they are in `log`.
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        json_any
    Reserve_Data  On

[FILTER]
    Name    modify
    Match   *
    Set     project ${LOG_PROJECT}
    Set     cluster ${LOG_CLUSTER}
    Set     env     ${LOG_ENV}
    Set     host    ${LOG_HOST}
    Copy    container service

[OUTPUT]
    Name                     es
    Match                    *
    Host                     ${ES_HOST}
    Port                     9200
    HTTP_User                fluentbit-${LOG_PROJECT}
    HTTP_Passwd              ${ES_PASSWORD}
    tls                      On
    tls.verify               On
    tls.ca_file              /fluent-bit/etc/conf/ca.crt
    Index                    logs-${LOG_PROJECT}
    Write_Operation          create
    Suppress_Type_Name       On
    Replace_Dots             On
    Time_Key                 @timestamp
    Buffer_Size              512KB
    Trace_Error              On
    # Keep retrying while Elasticsearch is unreachable; up to 2G is held on disk meanwhile.
    Retry_Limit              False
    storage.total_limit_size 2G
