# Alert rules for Replaice Desk, picked up by the kube-prometheus-stack Prometheus and routed through its
# Alertmanager.   kubectl apply -f prometheus-rules.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: replaice-desk
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: replaice-desk
      rules:
        - alert: ReplaiceDeskDown
          expr: up{job="replaice-desk"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: Replaice Desk is not responding
            description: Prometheus has not been able to scrape {{ $labels.instance }} for 3 minutes.

        - alert: ReplaiceDeskHighErrorRate
          expr: |
            sum(rate(replaice_http_requests_total{status="5xx"}[5m]))
              / sum(rate(replaice_http_requests_total[5m])) > 0.05
            and sum(rate(replaice_http_requests_total[5m])) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of Replaice Desk requests are failing
            description: '{{ $value | humanizePercentage }} of requests returned 5xx over the last 10 minutes.'

        - alert: ReplaiceDeskSlowAPI
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(replaice_http_request_duration_seconds_bucket{group="api"}[5m]))) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Replaice Desk API is slow
            description: 95th percentile API latency is {{ $value | humanizeDuration }}.

        - alert: ReplaiceDeskErrorSpike
          expr: sum by (source) (increase(replaice_log_messages_total{level=~"error|fatal"}[10m])) > 50
          labels:
            severity: warning
          annotations:
            summary: 'Replaice Desk is logging many errors from {{ $labels.source }}'
            description: '{{ $value | humanize }} errors in 10 minutes. Check Admin → Teams → System log.'

        - alert: ReplaiceDeskClassificationBacklog
          expr: replaice_classification_queue_lag > 100 or replaice_classification_queue_pending > 100
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: AI classification queue is backing up
            description: '{{ $value }} conversations are waiting to be classified.'

        - alert: ReplaiceDeskClassificationDeadLetters
          expr: increase(replaice_classification_queue_dead[30m]) > 0
          labels:
            severity: warning
          annotations:
            summary: AI classification jobs are failing permanently
            description: Jobs were moved to the dead-letter queue after too many attempts.

        - alert: ReplaiceDeskDBPoolExhausted
          expr: replaice_db_connections_in_use / replaice_db_connections_max > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Replaice Desk database pool is nearly full
            description: '{{ $value | humanizePercentage }} of database connections are in use.'
